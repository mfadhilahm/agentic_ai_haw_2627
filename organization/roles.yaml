# All twelve roles must be covered.
# A human may be accountable for multiple roles.
#
# Session 1:
# - current_actor_type may still be human while target_actor_type is agent/hybrid.
# - implementation_status may be planned.
#
# End of Session 2:
# - at least (12 - number_of_human_team_members) roles must be operationally
#   supported by an agent or hybrid implementation.
# - a role counts only when team-owned executable evidence exists.
# - one agent may support multiple roles only if role-specific behavior/output
#   is technically distinguishable and traceable.

roles:
  - id: managing_director_customer_lead
    title: Managing Director / Customer Lead
    responsibility: Customer communication, priorities, company-level decisions
    current_actor_type: human
    current_actor: yaw
    target_actor_type: human
    target_actor: yaw
    accountable_human: yaw
    human_approval_required: true
    implementation_status: implemented

  - id: product_owner_requirements
    title: Product Owner / Requirements Engineer
    responsibility: Requirements, user stories, acceptance criteria, backlog value
    current_actor_type: human
    current_actor: saad
    target_actor_type: human
    target_actor: saad
    accountable_human: saad
    human_approval_required: true
    implementation_status: implemented

  - id: project_manager
    title: Project Manager
    responsibility: Planning, task allocation, progress, dependencies, delivery risk
    current_actor_type: human
    current_actor: felix
    target_actor_type: human
    target_actor: felix
    accountable_human: felix
    human_approval_required: true
    implementation_status: implemented

  - id: software_architect
    title: Software Architect
    responsibility: System architecture, interfaces, ADRs, technical standards
    current_actor_type: hybrid
    current_actor: minh, dev_architect_agent
    target_actor_type: hybrid
    target_actor: minh, dev_architect_agent
    accountable_human: minh
    human_approval_required: true
    implementation_status: operational

  - id: backend_api_engineer
    title: Backend / API Engineer
    responsibility: FastAPI services, business logic, API contracts
    current_actor_type: hybrid
    current_actor: mirko, dev_architect_agent
    target_actor_type: hybrid
    target_actor: mirko, dev_architect_agent
    accountable_human: mirko
    human_approval_required: true
    implementation_status: operational

  - id: data_rag_engineer
    title: Data & RAG Engineer
    responsibility: PostgreSQL, pgvector, ingestion, chunking, retrieval, embeddings
    current_actor_type: hybrid
    current_actor: yaw, data-agent
    target_actor_type: hybrid
    target_actor: yaw, data-agent
    accountable_human: yaw
    human_approval_required: true
    implementation_status: operational

  - id: agent_engineer
    title: Agent Engineer
    responsibility: LangGraph workflows, LangChain integration, agent state and tools
    current_actor_type: hybrid
    current_actor: muhammad, platform-agent
    target_actor_type: hybrid
    target_actor: muhammad, platform-agent
    accountable_human: muhammad
    human_approval_required: true
    implementation_status: operational

  - id: integration_engineer
    title: Integration Engineer
    responsibility: Agent-to-agent and agent-to-system interfaces and handovers
    current_actor_type: hybrid
    current_actor: saad, platform-agent
    target_actor_type: hybrid
    target_actor: saad, platform-agent
    accountable_human: saad
    human_approval_required: true
    implementation_status: operational

  - id: qa_test_engineer
    title: QA & Test Engineer
    responsibility: pytest, regression testing, agent evaluation, quality evidence
    current_actor_type: hybrid
    current_actor: felix, qa-test-agent
    target_actor_type: hybrid
    target_actor: felix, qa-test-agent
    accountable_human: felix
    human_approval_required: true
    implementation_status: operational

  - id: devops_engineer
    title: DevOps Engineer
    responsibility: Docker, GitHub Actions, build, deployment and reproducibility
    current_actor_type: hybrid
    current_actor: mirko, ops-agent (devops)
    target_actor_type: hybrid
    target_actor: mirko, ops-agent (devops)
    accountable_human: mirko
    human_approval_required: true
    implementation_status: operational

  - id: ai_safety_security_engineer
    title: AI Safety & Security Engineer
    responsibility: Tool permissions, guardrails, secrets, prompt and agent risks (supported by deterministic Python AST security-agent checker)
    current_actor_type: hybrid
    current_actor: mirko, security-agent (deterministic AST checker)
    target_actor_type: hybrid
    target_actor: mirko, security-agent (deterministic AST checker)
    accountable_human: mirko
    human_approval_required: true
    implementation_status: operational

  - id: cost_observability_engineer
    title: Cost & Observability Engineer
    responsibility: Traces, runtime, token usage, cost model and cost optimization
    current_actor_type: hybrid
    current_actor: mirko, ops-agent (observability)
    target_actor_type: hybrid
    target_actor: mirko, ops-agent (observability)
    accountable_human: mirko
    human_approval_required: true
    implementation_status: operational
