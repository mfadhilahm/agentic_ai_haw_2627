    discount_tier_100_min_qty: "100"

# Session 7 Controlled Business Fault Task: 5% discount wrongly starts above 50 (quantity > 50 / min_qty 51; A3, A4, L7.2, L7.3)
s7_fault_task:
  task_id: "HP-S7-FAULT-001"
  description: "Controlled business fault injection: set 5% discount boundary to strictly above 50 (quantity >= 51) instead of from 50 (quantity >= 50) so Q03 yields 13700 instead of 13075 cents and is blocked by tests/test_quotation_s7.py."
  product_input_files:
    - "docs/issue-02-session-07.md"
    - "docs/issue-01-session-06.md"
    - "data/HansePack_Katalog.json"
    - "data/HansePack_Referenzfaelle.json"
    - "quotation/calculator.py"
  product_test_target: "tests/test_quotation_s7.py"
  max_correction_loops: 1
  additional_required_content:
    discount_tier_50_min_qty: "51"
    discount_tier_100_min_qty: "100"

