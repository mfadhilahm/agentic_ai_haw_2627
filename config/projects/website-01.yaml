# Session 3 Customer Project Configuration (A1: Separation and Addressing)
project_id: "website-01"
customer_name: "Nordwerk Industrie-Service"
customer_task_id: "NW-S3-001"
session: 3

# Relative path from the Software Factory repository root to the separate product checkout
product_repo_path: "../client-01-website"

# Allowed writable directory prefixes inside the product checkout (A4 sandbox)
allowed_write_prefixes:
  - "site/"

# Input files in the product checkout inspected by the Factory
product_input_files:
  - "docs/issue-01-session-03.md"
  - "site/index.html"
  - "site/styles.css"

# Target product file modified by the implementation agent
target_product_file: "site/index.html"

# Separate automated product check executed in the product checkout (B4)
product_test_target: "tests/test_website_s3.py"
product_test_command: "python -m unittest discover -s tests -p \"test_*.py\" -v"
product_start_command: "python -m http.server 8080 --directory site"

# Bounded retry/correction loop before human escalation (A4)
max_correction_loops: 2

# Accountable humans for Session 3 (D1)
