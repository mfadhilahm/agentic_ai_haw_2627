# -----------------------------------------------------------------------------
# Session 3–5 Customer Project 01 (Nordwerk Industrie-Service) Budget Plan (C2, C3)
# -----------------------------------------------------------------------------
# Per Client Brief: delivery plan budget for S3/S4 is agreed and tracked
# separately from Factory development, plus an explicit reserve for S5
# (CR-01 change request and SR-01 security advisory).
customer_project_01_budget_plan:
  project_id: "website-01"
  customer_name: "Nordwerk Industrie-Service"
  baseline_justification: >
    Team of 6 engineers. Customer delivery (scaffolding, AC scoping, product checks,
    human visual/accessibility review, and minor rework) is budgeted separately from
    reusable Software Factory engineering.
  s3_s4_delivery_plan_budget:
    human_delivery_hours: 3.5          # 1.0h S3 initial slice + 2.5h S4 full AC-01..AC-08
    human_review_hours: 1.5            # 0.5h S3 review + 1.0h S4 responsive/a11y review
    human_rework_hours: 1.0            # 0.25h S3 rework + 0.75h S4 layout/test fixes
    planned_human_delivery_credits: 600.0
    planned_agent_credits: 25.0        # ~12-15 multi-agent workflow calls across S3 & S4
    planned_ci_credits: 6.0            # ~6 CI runs across S3 & S4
    total_s3_s4_delivery_budget_credits: 631.0
  s5_reserve_budget:
    justification: >
      Reserved strictly for Session 5 unknown change request (CR-01), component inventory,
      and security advisory response (SR-01) under AC-09 and AC-10.
    human_delivery_and_advisory_hours: 2.0
    human_review_and_rework_hours: 1.0
    planned_human_reserve_credits: 300.0
    planned_agent_and_ci_reserve_credits: 15.0
    total_s5_reserve_credits: 315.0
  separate_factory_development_budget:
    justification: >
      Factory engineering (multi-repo sandboxing, bounded retry loops, handover schemas,
      strict LLM validation, and Factory pytest suite) is accounted separately from customer delivery.
    s3_s5_factory_development_hours: 4.0
    planned_factory_development_credits: 400.0

